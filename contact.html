<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Salsabil International - Strategic Cross-Border Logistics and Freight Operations Desk.">
  <title>Contact | Salsabil International</title>
  <link rel="icon" type="image/png" href="assets/salsabil_logo.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-view-body">

  <!-- Photographic Background -->
  <div class="page-bg" style="background-image: url('assets/bg_contact_clean.jpg');"></div>
  <div class="page-overlay"></div>

  <!-- Site Header (Menu for other pages: ON-FIELD, PRODUCT, LEGALS, CONTACT) -->
  <header class="site-header">
    <a href="index.html" class="header-brand" aria-label="NGHS Home">
      <img src="assets/nghs_logo.png" alt="NGHS" class="brand-logo-img">
    </a>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" aria-label="Toggle Navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <nav class="nav-menu-wrapper">
      <ul class="nav-links-list">
        <li><a href="on-field.html" class="nav-link" data-cipher>ON-FIELD</a></li>
        <li><a href="product.html" class="nav-link" data-cipher>PRODUCT</a></li>
        <li><a href="legals.html" class="nav-link" data-cipher>LEGALS</a></li>
        <li><a href="index.html" class="page-switch-badge" title="Return to Home Slide Deck">HOME // DECK</a></li>
      </ul>
      <a href="contact.html" class="btn-contact" data-cipher>CONTACT</a>
    </nav>
  </header>

  <!-- Page Container -->
  <main class="page-view-container">
    <div class="page-view-content">

      <div class="contact-layout-box">

        <!-- Title & Subtitle Matching Contact.jpg -->
        <div class="contact-header">
          <h1 class="contact-title" data-cipher>CONTACT</h1>
          <div class="contact-rule"></div>
          <div class="contact-subtitle" data-cipher>CONNECTING FOR SEAMLESS LOGISTICS SOLUTIONS</div>
        </div>

        <!-- Form Grid -->
        <form id="mainContactForm" class="contact-form-grid" novalidate>
          <div class="form-row-2">
            <div class="form-group">
              <label for="firstName" class="form-label" data-cipher>FIRST NAME</label>
              <!-- Pre-filled and styled white as shown in Contact.jpg -->
              <input type="text" id="firstName" name="firstName" class="input-chamfer highlighted-filled" value="JAMES ROBERT" required>
            </div>
            <div class="form-group">
              <label for="lastName" class="form-label" data-cipher>LAST NAME</label>
              <input type="text" id="lastName" name="lastName" class="input-chamfer" placeholder="ENTER YOUR LAST NAME" required>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="email" class="form-label" data-cipher>EMAIL</label>
              <input type="email" id="email" name="email" class="input-chamfer" placeholder="ENTER YOUR EMAIL" required>
            </div>
            <div class="form-group">
              <label for="phone" class="form-label" data-cipher>PHONE</label>
              <input type="tel" id="phone" name="phone" class="input-chamfer" placeholder="ENTER YOUR PHONE NUMBER">
            </div>
          </div>

          <div class="form-group">
            <label for="message" class="form-label" data-cipher>MESSAGE</label>
            <textarea id="message" name="message" class="textarea-chamfer" placeholder="TYPE YOUR MESSAGE" rows="5" required></textarea>
          </div>

          <div class="form-submit-row">
            <button type="submit" class="btn-chamfer-submit" data-cipher>SUBMIT</button>
          </div>
        </form>

      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-legal">
      © 2024-2025 Salsabil International. All Rights Reserved.
      <a href="legals.html#brand-assets" class="footer-legal-link">Brand Assets</a> | 
      <a href="legals.html#terms" class="footer-legal-link">Terms Of Service</a> | 
      <a href="legals.html#privacy" class="footer-legal-link">Privacy Policy</a> 
      <a href="legals.html#cookies" class="footer-legal-link">Cookie Preferences</a>
    </div>

    <!-- Center Down Arrow (Links back to Home) -->
    <div class="footer-center">
      <a href="index.html" class="scroll-down-btn" aria-label="Return to Home Deck" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </a>
    </div>

    <!-- Footer Links: TELEGRAM, WHATSAPP, E-MAIL -->
    <div class="footer-links">
      <a href="#telegram" class="footer-link footer-telegram" data-cipher>TELEGRAM</a>
      <a href="#whatsapp" class="footer-link footer-whatsapp" data-cipher>WHATSAPP</a>
      <a href="mailto:procurement@salsabil-international.com" class="footer-link footer-email" data-cipher>E-MAIL</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/cipher.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
